[workspace]
members = ["crates/anonymizer", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anonymizer = { path = "crates/anonymizer" }

axum = "0.8.9"
blake3 = "1.8.7"
http-body-util = "0.1.5"
proptest = "1.11.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
uuid = "1.26.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
