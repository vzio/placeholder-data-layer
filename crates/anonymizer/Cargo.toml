[package]
name = "anonymizer"
description = "Deterministic, I/O-free anonymization engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# Derives `ts_rs::TS` on the report, profile and dataset types that cross
# the HTTP boundary, so `clients/typescript` can generate bindings from
# them. Off by default: a plain `cargo build`/`cargo test` never links
# ts-rs, keeping it out of the engine's production dependency graph.
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
