[package]
name = "server"
description = "HTTP transport for the anonymization engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anonymizer.workspace = true
axum.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower-http = { workspace = true, features = ["trace", "limit", "request-id"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std", "ansi"] }
ts-rs = { workspace = true, optional = true, features = ["uuid-impl"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[features]
# See `anonymizer`'s `ts` feature: derives `ts_rs::TS` on this crate's wire
# types too, so the generated bindings cover the full request/response
# contract rather than just the engine's own report and profile types.
ts = ["dep:ts-rs", "anonymizer/ts"]

[dev-dependencies]
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
